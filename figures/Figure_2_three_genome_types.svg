<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1000" viewBox="0 0 1800 1000" role="img" aria-labelledby="title desc">
  <title id="title">CellGen representations across virus, bacterium and fungus</title>
  <desc id="desc">Three containment diagrams and their CellGen records show how one grammar represents a virus, a bacterium and a fungal chromosome containing a Starship element.</desc>
  <defs>
    <style>
      .sans { font-family: Inter, Arial, sans-serif; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
      .heading { font: 700 28px Inter, Arial, sans-serif; fill: #17212b; }
      .organism { font: italic 18px Inter, Arial, sans-serif; fill: #687584; }
      .node-title { font: 700 17px Inter, Arial, sans-serif; }
      .node-detail { font: 14px Inter, Arial, sans-serif; fill: #6b7480; }
      .code-label { font: 700 15px Inter, Arial, sans-serif; fill: #596574; letter-spacing: 0.04em; }
      .code { font: 17px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #27313c; }
      .foot { font: 16px Inter, Arial, sans-serif; fill: #65707d; }
    </style>
  </defs>
  <rect width="1800" height="1000" fill="#ffffff"/>

  <!-- Column guides -->
  <line x1="600" y1="40" x2="600" y2="930" stroke="#e0e5eb" stroke-width="2"/>
  <line x1="1200" y1="40" x2="1200" y2="930" stroke="#e0e5eb" stroke-width="2"/>

  <!-- Virus -->
  <text x="40" y="60" class="heading">Virus</text>
  <text x="40" y="91" class="organism">Enterobacteria phage T4</text>
  <rect x="40" y="130" width="520" height="245" rx="14" fill="#fff7eb" stroke="#e77914" stroke-width="3" stroke-dasharray="9 7"/>
  <text x="66" y="166" class="node-title" fill="#d96708">T4 genome</text>
  <text x="66" y="191" class="node-detail">phage · dsDNA</text>
  <text x="300" y="268" text-anchor="middle" class="node-title" fill="#d96708">A virus is represented as a bare { } entity</text>
  <text x="300" y="298" text-anchor="middle" class="node-detail">No chromosome is asserted</text>

  <text x="40" y="435" class="code-label">CELLGEN RECORD</text>
  <rect x="40" y="454" width="520" height="206" rx="10" fill="#f7f9fb" stroke="#d7dee7" stroke-width="2"/>
  <text x="65" y="493" class="code"><tspan fill="#e77914">{}</tspan><tspan fill="#c45e05">T4</tspan>[</text>
  <text x="93" y="528" class="code">type=<tspan fill="#6b3fa0">"phage"</tspan>,</text>
  <text x="93" y="563" class="code">genome=<tspan fill="#6b3fa0">"dsDNA"</tspan></text>
  <text x="65" y="598" class="code">]</text>

  <!-- Bacterium -->
  <text x="640" y="60" class="heading">Bacterium</text>
  <text x="640" y="91" class="organism">Klebsiella pneumoniae</text>
  <rect x="640" y="130" width="520" height="250" rx="14" fill="#eef4fd" stroke="#3975dc" stroke-width="3"/>
  <text x="666" y="166" class="node-title" fill="#3975dc">chromosome</text>
  <text x="666" y="191" class="node-detail">circular</text>
  <rect x="672" y="212" width="456" height="134" rx="12" fill="#fff7eb" stroke="#e77914" stroke-width="3" stroke-dasharray="9 7"/>
  <text x="696" y="244" class="node-title" fill="#d96708">Tn4401</text>
  <text x="696" y="267" class="node-detail">transposon</text>
  <rect x="696" y="286" width="188" height="38" rx="19" fill="#d92d2d"/>
  <text x="790" y="311" text-anchor="middle" class="node-title" fill="#ffffff">blaKPC-2</text>

  <rect x="640" y="398" width="520" height="214" rx="14" fill="#fff7eb" stroke="#e77914" stroke-width="3" stroke-dasharray="9 7"/>
  <text x="666" y="434" class="node-title" fill="#d96708">pKPC</text>
  <text x="666" y="459" class="node-detail">conjugative plasmid</text>
  <rect x="672" y="478" width="456" height="105" rx="12" fill="#fffaf2" stroke="#e77914" stroke-width="3" stroke-dasharray="9 7"/>
  <text x="696" y="510" class="node-title" fill="#d96708">intI1</text>
  <text x="696" y="533" class="node-detail">integron</text>
  <rect x="840" y="497" width="218" height="38" rx="19" fill="#d92d2d"/>
  <text x="949" y="522" text-anchor="middle" class="node-title" fill="#ffffff">blaCTX-M-15</text>

  <text x="640" y="663" class="code-label">CELLGEN RECORD</text>
  <rect x="640" y="682" width="520" height="248" rx="10" fill="#f7f9fb" stroke="#d7dee7" stroke-width="2"/>
  <text x="663" y="717" class="code">(</text>
  <text x="687" y="748" class="code">{<tspan fill="#e77914">{}</tspan><tspan fill="#b52525">blaKPC-2</tspan>[type=<tspan fill="#6b3fa0">"gene"</tspan>]</text>
  <text x="687" y="779" class="code">}<tspan fill="#c45e05">Tn4401</tspan>[type=<tspan fill="#6b3fa0">"transposon"</tspan>]</text>
  <text x="663" y="810" class="code">)<tspan fill="#2f68c5">chromosome</tspan>,</text>
  <text x="663" y="841" class="code">{{<tspan fill="#e77914">{}</tspan><tspan fill="#b52525">blaCTX-M-15</tspan>[type=<tspan fill="#6b3fa0">"gene"</tspan>]</text>
  <text x="687" y="872" class="code">}<tspan fill="#c45e05">intI1</tspan>[type=<tspan fill="#6b3fa0">"integron"</tspan>]</text>
  <text x="663" y="903" class="code">}<tspan fill="#c45e05">pKPC</tspan>[type=<tspan fill="#6b3fa0">"plasmid"</tspan>]</text>

  <!-- Fungus -->
  <text x="1240" y="60" class="heading">Fungus</text>
  <text x="1240" y="91" class="organism">Macrophomina phaseolina</text>
  <rect x="1240" y="130" width="520" height="482" rx="14" fill="#eef4fd" stroke="#3975dc" stroke-width="3"/>
  <text x="1266" y="166" class="node-title" fill="#3975dc">chromosome</text>
  <text x="1266" y="191" class="node-detail">fungal chromosome</text>
  <rect x="1272" y="212" width="456" height="366" rx="12" fill="#fff7eb" stroke="#e77914" stroke-width="3" stroke-dasharray="9 7"/>
  <text x="1298" y="247" class="node-title" fill="#d96708">Starship</text>
  <text x="1298" y="272" class="node-detail">schematic starship element</text>
  <rect x="1298" y="300" width="242" height="42" rx="21" fill="#d92d2d"/>
  <text x="1419" y="327" text-anchor="middle" class="node-title" fill="#ffffff">DUF3435 captain</text>
  <rect x="1298" y="365" width="402" height="170" rx="12" fill="#fffaf2" stroke="#e77914" stroke-width="3" stroke-dasharray="9 7"/>
  <text x="1324" y="400" class="node-title" fill="#d96708">cargo gene cluster</text>
  <text x="1324" y="427" class="node-detail">cargo represented as a contained entity</text>
  <rect x="1324" y="455" width="142" height="36" rx="18" fill="#d92d2d"/>
  <text x="1395" y="479" text-anchor="middle" class="node-title" fill="#ffffff">cargo A</text>
  <rect x="1480" y="455" width="142" height="36" rx="18" fill="#d92d2d"/>
  <text x="1551" y="479" text-anchor="middle" class="node-title" fill="#ffffff">cargo B</text>

  <text x="1240" y="663" class="code-label">CELLGEN RECORD</text>
  <rect x="1240" y="682" width="520" height="248" rx="10" fill="#f7f9fb" stroke="#d7dee7" stroke-width="2"/>
  <text x="1263" y="717" class="code">(</text>
  <text x="1287" y="748" class="code">{</text>
  <text x="1311" y="779" class="code"><tspan fill="#e77914">{}</tspan><tspan fill="#b52525">DUF3435_captain</tspan>[role=<tspan fill="#6b3fa0">"captain"</tspan>],</text>
  <text x="1311" y="810" class="code"><tspan fill="#e77914">{}</tspan><tspan fill="#c45e05">cargo_gene_cluster</tspan>[role=<tspan fill="#6b3fa0">"cargo"</tspan>]</text>
  <text x="1287" y="841" class="code">}<tspan fill="#c45e05">Starship</tspan>[type=<tspan fill="#6b3fa0">"starship"</tspan>]</text>
  <text x="1263" y="872" class="code">)<tspan fill="#2f68c5">chromosome</tspan>[</text>
  <text x="1287" y="903" class="code">organism=<tspan fill="#6b3fa0">"M. phaseolina"</tspan>]</text>

  <text x="900" y="973" text-anchor="middle" class="foot">Parentheses identify chromosomes; curly braces identify every other biological entity. Nesting records containment in each genome type.</text>
</svg>
